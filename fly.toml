# fly.toml app configuration file generated for kalshi-market-recorder on 2026-09-13T20:08:26-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'kalshi-market-recorder'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[deploy]
  strategy = 'immediate'

[env]
  COLLECTOR_MODE = 'daemon'
  DEPLOYMENT_ENV = 'production'
  HEALTH_PORT = '8080'
  LOG_LEVEL = 'info'
  LOG_PRETTY = 'false'
  NORMALIZED_RETENTION_ENABLED = 'false'
  RAW_DB_RETENTION_ENABLED = 'false'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = false
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '10s'
    grace_period = '1m0s'
    method = 'GET'
    path = '/live'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1gb'
